name: Warm OnBid Cache

on:
  schedule:
    - cron: '0 16 * * *' # 01:00 KST daily
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Warm shared OnBid dataset cache
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://seoul-redevelopment-pocket-ydg6042-6317.vercel.app'
          echo 'Warming shared OnBid dataset...'
          data="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 900 "$BASE/api/onbid?all=1")"
          echo "$data" | jq '{version,generatedAt,count,errors:(.apiErrors|length),complete:.scanCoverage.complete}'
          test "$(echo "$data" | jq -r '.ok')" = 'true'
          echo 'OnBid shared cache warm complete.'
