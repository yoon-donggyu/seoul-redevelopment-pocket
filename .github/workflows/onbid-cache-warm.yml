name: Update OnBid Dataset

on:
  schedule:
    - cron: '0 16 * * *' # 01:00 KST daily
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/onbid-cache-warm.yml'
      - 'api/onbid.js'

permissions:
  contents: write

concurrency:
  group: onbid-dataset
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel deployment
        run: sleep 25

      - name: Collect complete OnBid dataset
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://seoul-redevelopment-pocket-ydg6042-6317.vercel.app'
          TMP="$(mktemp -d)"
          CODES=(0007 0010 0005 0002 0003)
          n=0

          fetch_page() {
            local code="$1" page="$2" out="$3"
            echo "fetch code=$code page=$page"
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 6 --max-time 90 \
              "$BASE/api/onbid?code=$code&page=$page" -o "$out"
            jq -e '.ok == true and (.items|type=="array")' "$out" >/dev/null
          }

          for code in "${CODES[@]}"; do
            first="$TMP/page-${code}-1.json"
            fetch_page "$code" 1 "$first"
            n=$((n+1))
            total="$(jq -r '.totalCount // 0' "$first")"
            rows="$(jq -r '.rowsPerPage // 1000' "$first")"
            pages=$(( (total + rows - 1) / rows ))
            if [ "$pages" -lt 1 ]; then pages=1; fi
            echo "code=$code total=$total pages=$pages"
            for page in $(seq 2 "$pages"); do
              sleep 3
              fetch_page "$code" "$page" "$TMP/page-${code}-${page}.json"
              n=$((n+1))
            done
            sleep 3
          done

          mkdir -p data
          jq -s '
            def key: [(.cltrMngNo//""),(.pbctCdtnNo//""),(.name//""),(.address//"")] | join("|");
            {
              ok:true,
              ready:true,
              version:"static-1.0",
              generatedAt:(now|todateiso8601),
              source:"대한민국 온비드 공공데이터 API",
              count:([.[].items[]?] | unique_by(key) | length),
              items:([.[].items[]?] | unique_by(key)),
              apiErrors:[],
              scanCoverage:{complete:true,pagesFetched:length}
            }
          ' "$TMP"/page-*.json > data/onbid-auctions.json.tmp
          mv data/onbid-auctions.json.tmp data/onbid-auctions.json
          jq '{version,generatedAt,count,complete:.scanCoverage.complete}' data/onbid-auctions.json

      - name: Commit dataset only when collection succeeds
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/onbid-auctions.json; then
            echo 'No OnBid dataset change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/onbid-auctions.json
          git commit -m 'data: refresh OnBid auctions'
          git push
